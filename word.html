<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MyEnglishHub - 英语学习小软件</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-slate-50">

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const Icons = {
      Book: () => <svg className="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}><path strokeLinecap="round" strokeLinejoin="round" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" /></svg>,
      Share: () => <svg className="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}><path strokeLinecap="round" strokeLinejoin="round" d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z" /></svg>,
      Check: () => <svg className="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}><path strokeLinecap="round" strokeLinejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>,
      Settings: () => <svg className="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}><path strokeLinecap="round" strokeLinejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" /><path strokeLinecap="round" strokeLinejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /></svg>,
      Sparkles: () => <svg className="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}><path strokeLinecap="round" strokeLinejoin="round" d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z" /></svg>,
      List: () => <svg className="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}><path strokeLinecap="round" strokeLinejoin="round" d="M4 6h16M4 10h16M4 14h16M4 18h16" /></svg>,
      Grid: () => <svg className="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}><path strokeLinecap="round" strokeLinejoin="round" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zm10 0a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zm10 0a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z" /></svg>,
      EyeOff: () => <svg className="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}><path strokeLinecap="round" strokeLinejoin="round" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21" /></svg>,
      Trash: () => <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}><path strokeLinecap="round" strokeLinejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>,
      Plus: () => <svg className="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}><path strokeLinecap="round" strokeLinejoin="round" d="M12 4v16m8-8H4" /></svg>,
      X: () => <svg className="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}><path strokeLinecap="round" strokeLinejoin="round" d="M6 18L18 6M6 6l12 12" /></svg>,
      Key: () => <svg className="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}><path strokeLinecap="round" strokeLinejoin="round" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z" /></svg>,
      Link: () => <svg className="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}><path strokeLinecap="round" strokeLinejoin="round" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1" /></svg>,
      Server: () => <svg className="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}><path strokeLinecap="round" strokeLinejoin="round" d="M5 12h14M5 12a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v4a2 2 0 01-2 2M5 12a2 2 0 00-2 2v4a2 2 0 002 2h14a2 2 0 002-2v-4a2 2 0 00-2-2m-2-4h.01M17 16h.01" /></svg>
    };

    // 常用的模型预设，方便用户一键填入
    const API_PRESETS = [
      { name: "DeepSeek (深度求索)", baseUrl: "https://api.deepseek.com", model: "deepseek-chat" },
      { name: "Kimi (月之暗面)", baseUrl: "https://api.moonshot.cn", model: "moonshot-v1-8k" },
      { name: "OpenAI (官方)", baseUrl: "https://api.openai.com", model: "gpt-3.5-turbo" },
      { name: "SiliconFlow (硅基流动免费池)", baseUrl: "https://api.siliconflow.cn", model: "Qwen/Qwen2.5-7B-Instruct" },
    ];

    function App() {
      const [activeTab, setActiveTab] = useState('wordbook');
      const [isLoggedIn, setIsLoggedIn] = useState(true);
      
      const [words, setWords] = useState([]);
      const [viewMode, setViewMode] = useState('complete'); 
      const [isReciteMode, setIsReciteMode] = useState(false);
      const [notification, setNotification] = useState('');
      
      const [isAddModalOpen, setIsAddModalOpen] = useState(false);
      const [inputMode, setInputMode] = useState('single'); 
      const [isGenerating, setIsGenerating] = useState(false);
      
      const [newWord, setNewWord] = useState({ spell: '', pos: '', meaning: '', enMeaning: '', example: '' });
      const [batchText, setBatchText] = useState('');

      // --- 全新的通用 API 状态管理 ---
      const [apiConfig, setApiConfig] = useState({
        baseUrl: 'https://api.deepseek.com',
        model: 'deepseek-chat',
        key: ''
      });
      const [inputConfig, setInputConfig] = useState({ ...apiConfig }); // 设置页面的临时状态

      useEffect(() => {
        const savedWords = localStorage.getItem('myWordbookData');
        if (savedWords) setWords(JSON.parse(savedWords));
        
        const savedConfig = localStorage.getItem('universalApiConfig');
        if (savedConfig) {
          const parsed = JSON.parse(savedConfig);
          setApiConfig(parsed);
          setInputConfig(parsed);
        }
      }, []);

      useEffect(() => {
        localStorage.setItem('myWordbookData', JSON.stringify(words));
      }, [words]);

      const showNotification = (msg) => {
        setNotification(msg);
        setTimeout(() => setNotification(''), 3000);
      };

      const handleSaveConfig = () => {
        setApiConfig(inputConfig);
        localStorage.setItem('universalApiConfig', JSON.stringify(inputConfig));
        showNotification('API 引擎配置已保存并生效！');
      };

      const applyPreset = (preset) => {
        setInputConfig(prev => ({ ...prev, baseUrl: preset.baseUrl, model: preset.model }));
        showNotification(`已应用 ${preset.name} 的地址和模型`);
      };

      // --- 核心：通用 OpenAI 格式 API 请求函数 ---
      const callUniversalAPI = async (systemPrompt, userPrompt) => {
        if (!apiConfig.key) {
           showNotification('未配置 API 密钥！请先在【设置】中填写。');
           setIsAddModalOpen(false); 
           setActiveTab('settings'); 
           return null;
        }

        // 规范化 BaseURL，自动补全 /v1/chat/completions
        let endpoint = apiConfig.baseUrl.trim();
        if(endpoint.endsWith('/')) endpoint = endpoint.slice(0, -1);
        if(!endpoint.endsWith('/v1/chat/completions')) {
           if(endpoint.endsWith('/v1')) endpoint += '/chat/completions';
           else endpoint += '/v1/chat/completions';
        }

        const payload = {
          model: apiConfig.model.trim() || 'gpt-3.5-turbo',
          messages: [
            { role: "system", content: systemPrompt },
            { role: "user", content: userPrompt }
          ],
          temperature: 0.1 // 较低的温度确保输出稳定的 JSON
        };
        
        try {
          const response = await fetch(endpoint, { 
            method: 'POST', 
            headers: { 
              'Content-Type': 'application/json',
              'Authorization': `Bearer ${apiConfig.key.trim()}`
            }, 
            body: JSON.stringify(payload) 
          });
          
          if (!response.ok) {
            const errData = await response.json();
            throw new Error(errData.error?.message || 'API 请求失败');
          }
          
          const data = await response.json();
          let content = data.choices[0].message.content;
          
          // 强力清洗模型返回的 Markdown JSON 标记
          content = content.replace(/```json\n?/gi, '').replace(/```\n?/g, '').trim();
          
          return JSON.parse(content);
        } catch (error) {
          console.error("API Error:", error);
          throw error;
        }
      };

      // 单个查词
      const generateWordDetails = async () => {
        if (!newWord.spell.trim()) { showNotification('请先输入英文单词！'); return; }
        setIsGenerating(true);
        
        const sysPrompt = "你是一个专业的英语词典。请解析用户给定的单词，只允许输出一个合法的JSON对象，包含四个字段：pos (词性简写，如 n.), meaning (中文释义), enMeaning (英译英), example (一个英文例句)。不要输出任何 Markdown 标记或其他多余文字。";
        const userPrompt = `需要解析的单词是：${newWord.spell}`;

        try {
          const result = await callUniversalAPI(sysPrompt, userPrompt);
          if(result) {
            setNewWord(prev => ({ ...prev, pos: result.pos||'', meaning: result.meaning||'', enMeaning: result.enMeaning||'', example: result.example||'' }));
            showNotification('✨ AI 成功填充词意！');
          }
        } catch (error) {
          showNotification(`获取失败：${error.message}`);
        } finally {
          setIsGenerating(false);
        }
      };

      // 批量导入
      const handleBatchImport = async () => {
        if (!batchText.trim()) { showNotification('请先粘贴文本内容。'); return; }
        setIsGenerating(true);
        
        const sysPrompt = "你是一个智能词汇提取助手。请从用户输入的杂乱文本中，提取出所有的英文单词（去除中文和符号），自动纠正拼写错误，并为每个单词补充词性、释义、英译英和例句。你必须只返回一个合法的 JSON 数组，数组里的每个对象包含字段：spell (单词正确拼写), pos (词性), meaning (中文释义), enMeaning (英译英), example (例句)。不要输出任何 Markdown 标记或其他文字。";
        const userPrompt = `文本内容：\n${batchText}`;

        try {
          const parsedArray = await callUniversalAPI(sysPrompt, userPrompt);
          if (Array.isArray(parsedArray) && parsedArray.length > 0) {
            const newEntries = parsedArray.map(item => ({
              id: Date.now().toString() + Math.random().toString(36).substring(7),
              ...item,
              createdAt: new Date().toISOString()
            }));
            
            setWords(prev => [...newEntries, ...prev]);
            setBatchText(''); 
            setIsAddModalOpen(false);
            showNotification(`🎉 成功识别并导入 ${parsedArray.length} 个单词！`);
          } else {
             showNotification('未能识别出单词或返回格式错误。');
          }
        } catch (error) {
          showNotification(`解析失败：${error.message}`);
        } finally {
          setIsGenerating(false);
        }
      };

      const handleAddSingleWord = (e) => {
        e.preventDefault();
        if (!newWord.spell.trim() || !newWord.meaning.trim()) { showNotification('单词和中文释义不能为空'); return; }
        const entry = { id: Date.now().toString(), ...newWord, createdAt: new Date().toISOString() };
        setWords([entry, ...words]);
        setNewWord({ spell: '', pos: '', meaning: '', enMeaning: '', example: '' });
        setIsAddModalOpen(false);
        showNotification('已加入单词本！');
      };

      const handleDelete = (id) => setWords(words.filter(w => w.id !== id));

      // --- 渲染模块 ---

      // 1. 设置页面 (全新通用 API 设置)
      const renderSettings = () => (
        <div className="max-w-3xl mx-auto mt-8 animate-fade-in-up">
          <div className="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
            <div className="px-8 py-6 border-b border-slate-100 bg-slate-50 flex items-center gap-4">
              <div className="bg-indigo-100 text-indigo-600 p-3 rounded-xl"><Icons.Settings /></div>
              <div>
                <h2 className="text-xl font-bold text-slate-800">AI 引擎设置</h2>
                <p className="text-sm text-slate-500">支持对接所有兼容 OpenAI 格式的大模型接口</p>
              </div>
            </div>

            <div className="p-8 space-y-8">
              {/* 预设快捷按钮 */}
              <div>
                <p className="text-sm font-bold text-slate-700 mb-3">快捷预设 (一键填入常用地址和模型)</p>
                <div className="flex flex-wrap gap-2">
                  {API_PRESETS.map((preset, idx) => (
                    <button 
                      key={idx}
                      onClick={() => applyPreset(preset)}
                      className="px-3 py-1.5 bg-slate-100 hover:bg-indigo-50 hover:text-indigo-600 text-slate-600 text-sm font-medium rounded-lg transition-colors border border-transparent hover:border-indigo-200"
                    >
                      {preset.name}
                    </button>
                  ))}
                </div>
              </div>

              <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div className="space-y-2">
                  <label className="flex items-center gap-2 text-sm font-bold text-slate-800">
                    <Icons.Link /> API 接口地址 (Base URL)
                  </label>
                  <input 
                    type="text" 
                    value={inputConfig.baseUrl}
                    onChange={(e) => setInputConfig({...inputConfig, baseUrl: e.target.value})}
                    placeholder="例如：https://api.deepseek.com"
                    className="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 outline-none text-slate-700 bg-slate-50 focus:bg-white transition-all font-mono text-sm"
                  />
                </div>
                <div className="space-y-2">
                  <label className="flex items-center gap-2 text-sm font-bold text-slate-800">
                    <Icons.Server /> 模型名称 (Model)
                  </label>
                  <input 
                    type="text" 
                    value={inputConfig.model}
                    onChange={(e) => setInputConfig({...inputConfig, model: e.target.value})}
                    placeholder="例如：deepseek-chat"
                    className="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 outline-none text-slate-700 bg-slate-50 focus:bg-white transition-all font-mono text-sm"
                  />
                </div>
              </div>

              <div className="space-y-2">
                <label className="flex items-center gap-2 text-sm font-bold text-slate-800">
                  <Icons.Key /> API 密钥 (API Key)
                </label>
                <input 
                  type="password" 
                  value={inputConfig.key}
                  onChange={(e) => setInputConfig({...inputConfig, key: e.target.value})}
                  placeholder="填写你的 Bearer Token 密钥 (例如：sk-...)"
                  className="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 outline-none text-slate-700 bg-slate-50 focus:bg-white transition-all font-mono text-sm"
                />
              </div>

              <div className="pt-4 border-t border-slate-100">
                <button 
                  onClick={handleSaveConfig}
                  className="w-full md:w-auto md:px-12 bg-indigo-600 hover:bg-indigo-700 text-white py-3 rounded-xl font-bold transition-colors shadow-sm"
                >
                  保存并应用配置
                </button>
              </div>

              <div className="bg-yellow-50 rounded-xl p-4 border border-yellow-100 mt-6">
                <p className="text-xs text-yellow-800 leading-relaxed">
                  <strong>开发者提示：</strong> 本应用目前已兼容市面上绝大部分标准 API（如 OpenAI, DeepSeek, Kimi, Qwen等）。你的配置和密钥**仅保留在当前浏览器本地缓存中**，绝对安全，不会上传至任何第三方服务器。
                </p>
              </div>
            </div>
          </div>
        </div>
      );

      // 2. 弹出层：多模式录入窗口
      const renderAddModal = () => {
        if (!isAddModalOpen) return null;

        return (
          <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4 transition-all">
            <div className="bg-white rounded-2xl w-full max-w-2xl shadow-2xl overflow-hidden flex flex-col">
              <div className="flex justify-between items-center px-6 py-4 border-b border-slate-100 bg-slate-50">
                <div className="flex bg-slate-200/50 p-1 rounded-lg">
                   <button onClick={() => setInputMode('single')} className={`px-4 py-1.5 rounded-md text-sm font-medium transition-all ${inputMode === 'single' ? 'bg-white text-indigo-600 shadow-sm' : 'text-slate-500 hover:text-slate-700'}`}>
                     单个录入
                   </button>
                   <button onClick={() => setInputMode('batch')} className={`px-4 py-1.5 rounded-md text-sm font-medium transition-all flex items-center gap-1 ${inputMode === 'batch' ? 'bg-white text-indigo-600 shadow-sm' : 'text-slate-500 hover:text-slate-700'}`}>
                     <Icons.Sparkles /> 智能批量导入
                   </button>
                </div>
                <button onClick={() => setIsAddModalOpen(false)} className="text-slate-400 hover:text-slate-600 hover:bg-slate-200/50 p-1.5 rounded-full transition-colors">
                  <Icons.X />
                </button>
              </div>

              <div className="p-6">
                {inputMode === 'single' ? (
                  <form onSubmit={handleAddSingleWord} className="space-y-5">
                    <div className="flex gap-3 items-start">
                      <div className="flex-1 relative">
                        <input type="text" placeholder="输入新单词 (e.g. Robust)" value={newWord.spell} onChange={e => setNewWord({...newWord, spell: e.target.value})} className="w-full pl-4 pr-12 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 outline-none text-lg font-bold transition-all bg-slate-50 focus:bg-white" />
                        <button type="button" onClick={generateWordDetails} disabled={isGenerating} className="absolute right-2 top-2 bottom-2 aspect-square flex items-center justify-center bg-indigo-50 text-indigo-600 hover:bg-indigo-100 rounded-lg transition-colors disabled:opacity-50">
                          {isGenerating ? <div className="w-4 h-4 border-2 border-indigo-600 border-t-transparent rounded-full animate-spin"></div> : <Icons.Sparkles />}
                        </button>
                      </div>
                    </div>
                    <div className="grid grid-cols-1 md:grid-cols-4 gap-4">
                      <input type="text" placeholder="词性 (如 adj.)" value={newWord.pos} onChange={e => setNewWord({...newWord, pos: e.target.value})} className="col-span-1 px-4 py-2.5 rounded-xl border border-slate-200 text-sm focus:border-indigo-500 outline-none focus:ring-2 focus:ring-indigo-500/20" />
                      <input type="text" placeholder="中文释义" value={newWord.meaning} onChange={e => setNewWord({...newWord, meaning: e.target.value})} className="col-span-3 px-4 py-2.5 rounded-xl border border-slate-200 text-sm focus:border-indigo-500 outline-none focus:ring-2 focus:ring-indigo-500/20" />
                    </div>
                    <input type="text" placeholder="英译英 (可选)" value={newWord.enMeaning} onChange={e => setNewWord({...newWord, enMeaning: e.target.value})} className="w-full px-4 py-2.5 rounded-xl border border-slate-200 text-sm font-serif focus:border-indigo-500 outline-none focus:ring-2 focus:ring-indigo-500/20" />
                    <textarea placeholder="例句 (可选)" value={newWord.example} onChange={e => setNewWord({...newWord, example: e.target.value})} rows="2" className="w-full px-4 py-2.5 rounded-xl border border-slate-200 text-sm focus:border-indigo-500 outline-none resize-none focus:ring-2 focus:ring-indigo-500/20" />
                    <div className="flex justify-end pt-4 gap-3">
                      <button type="submit" className="bg-slate-800 hover:bg-slate-900 text-white px-6 py-2.5 rounded-xl font-medium transition-colors">保存至单词本</button>
                    </div>
                  </form>
                ) : (
                  <div className="space-y-4">
                    <div className="bg-indigo-50/50 p-4 rounded-xl border border-indigo-100">
                      <p className="text-sm text-indigo-800 flex items-start gap-2">
                        <Icons.Sparkles /> <span>粘贴你的单词文本，无论是查词还是大段文章，AI 会自动提取所有生词、纠正拼写、并补充全部翻译和例句！</span>
                      </p>
                    </div>
                    <textarea 
                      placeholder="在此粘贴包含生词的文本..." 
                      value={batchText} onChange={e => setBatchText(e.target.value)} rows="6" 
                      className="w-full p-4 rounded-xl border border-slate-200 focus:border-indigo-500 outline-none resize-none focus:ring-2 focus:ring-indigo-500/20 text-slate-700 bg-slate-50 focus:bg-white transition-colors" 
                    ></textarea>
                    <div className="flex justify-end pt-2">
                      <button onClick={handleBatchImport} disabled={isGenerating || !batchText.trim()} className="flex items-center gap-2 bg-indigo-600 hover:bg-indigo-700 disabled:bg-indigo-400 text-white px-6 py-3 rounded-xl font-medium transition-all shadow-md active:scale-[0.98]">
                        {isGenerating ? <><div className="w-5 h-5 border-2 border-white border-t-transparent rounded-full animate-spin"></div> AI运转中...</> : <><Icons.Sparkles /> 智能提取导入</>}
                      </button>
                    </div>
                  </div>
                )}
              </div>
            </div>
          </div>
        );
      };

      const renderHeader = () => (
        <header className="h-16 bg-white border-b border-slate-200 flex items-center justify-between px-6 sticky top-0 z-20">
          <div className="text-xl font-bold text-slate-800 tracking-wide">MyEnglish<span className="text-indigo-600">Hub</span></div>
          <div className="flex items-center gap-4">
            <div className="relative group cursor-pointer">
              <div className="w-9 h-9 rounded-full bg-slate-800 text-white flex items-center justify-center font-bold text-sm shadow-sm ring-2 ring-white outline outline-1 outline-slate-200">my</div>
            </div>
          </div>
        </header>
      );

      const renderSidebar = () => {
        const navItems = [
          { id: 'wordbook', icon: Icons.Book, label: '单词本' }, { id: 'resources', icon: Icons.Share, label: '资源' },
          { id: 'checkin', icon: Icons.Check, label: '打卡' }, { id: 'settings', icon: Icons.Settings, label: '系统设置' },
        ];
        return (
          <aside className="w-20 md:w-56 bg-slate-50 border-r border-slate-200 h-[calc(100vh-4rem)] flex flex-col py-6 sticky top-16">
            <nav className="flex-1 px-3 space-y-1">
              {navItems.map(item => (
                <button key={item.id} onClick={() => setActiveTab(item.id)} className={`w-full flex items-center gap-3 px-3 py-3 md:px-4 rounded-xl transition-all font-medium ${activeTab === item.id ? 'bg-indigo-100/50 text-indigo-700' : 'text-slate-600 hover:bg-slate-100/50 hover:text-slate-900'}`}>
                  <div className={activeTab === item.id ? 'text-indigo-600' : 'text-slate-400'}><item.icon /></div>
                  <span className="hidden md:block">{item.label}</span>
                </button>
              ))}
            </nav>
          </aside>
        );
      };

      const renderWordbook = () => (
        <div className="max-w-5xl mx-auto">
          <div className="flex flex-col sm:flex-row sm:items-center justify-between mb-8 gap-4">
             <div><h2 className="text-2xl font-bold text-slate-800">我的词库 ({words.length})</h2></div>
             <div className="flex items-center gap-3">
                <div className="flex items-center gap-1 bg-white p-1 rounded-lg border border-slate-200 shadow-sm">
                  <button onClick={() => setViewMode('simple')} className={`flex items-center gap-1.5 px-3 py-1.5 rounded-md text-sm font-medium transition-colors ${viewMode === 'simple' ? 'bg-slate-100 text-slate-800' : 'text-slate-400 hover:text-slate-600'}`}><Icons.List /> 简法</button>
                  <button onClick={() => setViewMode('complete')} className={`flex items-center gap-1.5 px-3 py-1.5 rounded-md text-sm font-medium transition-colors ${viewMode === 'complete' ? 'bg-slate-100 text-slate-800' : 'text-slate-400 hover:text-slate-600'}`}><Icons.Grid /> 完整</button>
                </div>
             </div>
          </div>
          
          {viewMode === 'simple' && (
            <div className="bg-white rounded-2xl border border-slate-200 overflow-hidden shadow-sm">
              <div className="bg-slate-50 px-4 py-3 border-b border-slate-200 flex justify-between items-center">
                <span className="text-sm font-medium text-slate-500">每行一个单词加词意</span>
                <button onClick={() => setIsReciteMode(!isReciteMode)} className={`flex items-center gap-2 text-sm px-3 py-1.5 rounded-full transition-colors ${isReciteMode ? 'bg-indigo-100 text-indigo-700 font-bold' : 'bg-white border border-slate-200 text-slate-600'}`}><Icons.EyeOff /> {isReciteMode ? '退出背诵' : '背诵模式'}</button>
              </div>
              <div className="divide-y divide-slate-100">
                {words.map((word, idx) => (
                  <div key={word.id} className="flex items-center justify-between p-4 hover:bg-slate-50 group">
                    <div className="flex items-center gap-4 flex-1">
                      <span className="text-slate-400 w-6 text-sm">{idx + 1}.</span>
                      <span className="font-bold text-lg text-slate-800 w-1/4">{word.spell}</span>
                      <div className={`flex-1 transition-all ${isReciteMode ? 'blur-sm hover:blur-none cursor-pointer bg-slate-200 rounded text-transparent hover:text-slate-600 hover:bg-transparent px-2' : 'text-slate-600'}`}>
                        <span className="text-xs text-slate-400 mr-2">{word.pos}</span>{word.meaning}
                      </div>
                    </div>
                    <button onClick={() => handleDelete(word.id)} className="text-slate-300 hover:text-red-500 opacity-0 group-hover:opacity-100 px-2"><Icons.Trash /></button>
                  </div>
                ))}
              </div>
            </div>
          )}

          {viewMode === 'complete' && (
            <div className="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-5 pb-20">
              {words.map(word => (
                <div key={word.id} className="bg-[#fdfbf7] rounded-xl border border-[#e8e4dc] p-6 shadow-sm hover:shadow-md relative group flex flex-col">
                  <button onClick={() => handleDelete(word.id)} className="absolute top-4 right-4 text-slate-300 hover:text-red-500 opacity-0 group-hover:opacity-100"><Icons.Trash /></button>
                  <div className="mb-5"><h3 className="text-2xl font-black text-slate-900 tracking-tight">{word.spell}</h3></div>
                  <div className="space-y-3 flex-1 text-sm">
                    <div className="flex items-start gap-2"><span className="shrink-0 font-medium text-slate-400 w-12">中英</span><span className="text-slate-800"><span className="italic mr-1 text-slate-500">{word.pos}</span>{word.meaning}</span></div>
                    {word.enMeaning && <div className="flex items-start gap-2"><span className="shrink-0 font-medium text-slate-400 w-12">英译英</span><span className="text-slate-700 font-serif leading-relaxed">{word.enMeaning}</span></div>}
                    {word.example && <div className="flex items-start gap-2 pt-3 mt-1 border-t border-[#e8e4dc]/50"><span className="shrink-0 font-medium text-slate-400 w-12">例句</span><span className="text-slate-600 italic">"{word.example}"</span></div>}
                  </div>
                </div>
              ))}
            </div>
          )}
        </div>
      );

      return (
        <div className="min-h-screen bg-slate-50 font-sans flex flex-col relative">
          {renderAddModal()}
          {notification && <div className="fixed top-20 left-1/2 transform -translate-x-1/2 bg-slate-800 text-white px-6 py-3 rounded-full shadow-lg text-sm font-medium z-[60]">{notification}</div>}
          {renderHeader()}
          <div className="flex flex-1 overflow-hidden">
            {renderSidebar()}
            <main className="flex-1 overflow-y-auto p-6 md:p-8">
              {activeTab === 'wordbook' && renderWordbook()}
              {activeTab === 'settings' && renderSettings()}
            </main>
          </div>
          {activeTab === 'wordbook' && (
            <button onClick={() => setIsAddModalOpen(true)} className="fixed bottom-10 right-10 w-14 h-14 bg-indigo-600 text-white rounded-full flex items-center justify-center shadow-lg shadow-indigo-600/30 hover:bg-indigo-700 hover:scale-105 transition-all z-40">
              <Icons.Plus />
            </button>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
